<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Ensure trailing slash on GitHub Pages directory so relative asset paths never 404
      (function() {
        var path = window.location.pathname;
        if (path && path.length > 1 && path.slice(-1) !== '/' && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>NovaPlay Unblocked</title>
    <meta name="description" content="A clean, fast unblocked web games portal with embedded iframe games." />
    <meta property="og:title" content="NovaPlay Unblocked" />
    <meta property="og:description" content="A clean, fast unblocked web games portal with embedded iframe games." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='14' x='2' y='5' rx='4' fill='%230a0a0c' stroke='%2322d3ee'/%3E%3Cline x1='6' x2='10' y1='12' y2='12' stroke='%2322d3ee'/%3E%3Cline x1='8' x2='8' y1='10' y2='14' stroke='%2322d3ee'/%3E%3Ccircle cx='15' cy='12' r='1' fill='%2322d3ee'/%3E%3Ccircle cx='18' cy='10' r='1' fill='%2322d3ee'/%3E%3C/svg%3E" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 2rem; color: #fff; font-family: sans-serif; text-align: center; background: #0a0a0a;">
          <h2>JavaScript is required</h2>
          <p>Please enable JavaScript in your browser to play NovaPlay Unblocked games.</p>
        </div>
      </noscript>
    </div>

    <!-- Primary entry point for Vite dev server and bundler -->
    <script type="module" src="./src/main.js"></script>

    <!-- Fallback loader for static hosting (e.g. GitHub Pages root branch deployment) -->
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('JavaScript is required') !== -1)) {
          if (!document.querySelector('link[href*="app.css"]')) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './assets/app.css';
            document.head.appendChild(css);
          }
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js';
          document.body.appendChild(script);
        }
      }, 100);
    </script>
  </body>
</html>
