<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Ensure trailing slash on GitHub Pages directory so relative asset paths never 404
      (function() {
        var path = window.location.pathname;
        if (path && path.length > 1 && path.slice(-1) !== '/' && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="importmap">

  <body>
    <div id="root">
      <noscript>
        <div style="padding: 2rem; color: #fff; font-family: sans-serif; text-align: center; background: #0a0a0a;">
          <h2>JavaScript is required</h2>
          <p>Please enable JavaScript in your browser to play NovaPlay Unblocked games.</p>
        </div>
      </noscript>
    </div>

    <!-- Smart script loader: loads pre-bundled assets on GitHub Pages static hosting, or src/main.js in Vite dev server -->
    <script>
      (function() {
        var isDev = window.location.port === '3000' || !!window.__vite_plugin_react_preamble_installed__;
        if (isDev) {
          var devScript = document.createElement('script');
          devScript.type = 'module';
          devScript.src = './src/main.js';
          document.body.appendChild(devScript);
        } else {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './assets/app.css';
          document.head.appendChild(css);

          var prodScript = document.createElement('script');
          prodScript.type = 'module';
          prodScript.crossOrigin = 'anonymous';
          prodScript.src = './assets/app.js';
          document.body.appendChild(prodScript);
        }
      })();
    </script>
  </body>
